spring.application.name=petrent-api

# ── Servidor ─────────────────────────────────────────────────
server.port=8080

# ── Conexión a PostgreSQL ────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petrent_db}
spring.datasource.username=${DB_USERNAME:petrent_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Pool de conexiones HikariCP ──────────────────────────────
spring.datasource.hikari.pool-name=PetrentPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Niveles de log ───────────────────────────────────────────
logging.level.com.petrent.api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.security=INFO

# ── CORS ─────────────────────────────────────────────────────
app.cors.origenes=${APP_CORS_ORIGENES:http://localhost:5173}

# ── Administrador inicial ────────────────────────────────────
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.correo=${APP_ADMIN_EMAIL:admin@petrent.com}

# ── Swagger / OpenAPI ────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ── Jackson ─────────────────────────────
spring.jackson.time-zone=UTC

# ── Ollama (IA local) ─────────────────────────────────────────
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.modelo=${OLLAMA_MODELO:llama3.2:3b}
